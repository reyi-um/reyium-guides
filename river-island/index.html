stays lit, turn the knob to High or your preferred setting. When you're finished, make sure the knob is turned off.\nWood fire pit: Allowed only when CAL FIRE restrictions are lifted, usually sometime between about November and March. If the fire restrictions notice is showing at the top of this guide, wood fires are not allowed. We provide a limited amount of firewood. Please keep fires small and attended, and make sure they are fully out before you leave or go to bed.\nPlease never discard cigarettes, matches, charcoal or other burning material outdoors, and stay with the BBQ and fire pit whenever they are lit.\nInside the home, candles, incense and other open flames are not permitted.", "image": "PLACEHOLDER: Photo of the propane fire pit table: propane valve, ignite/pilot knob and igniter button", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Quiet hours", "body": "Quiet hours are 10 PM to 8 AM. Outdoors, please keep noise down out of respect for the neighbors and the dark night environment.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Address", "body": "40852 Blossom Drive, Three Rivers, CA 93271", "image": "", "link": "https://www.google.com/maps/search/?api=1&query=40852+Blossom+Drive+Three+Rivers+CA+93271", "linkLabel": "Open in Maps"}, {"section": "wifi", "title": "Wi-Fi", "body": "Network: Reyium\nPassword: 3RiversHealing\nInternet outages: If the internet goes down, please message us as soon as possible. We'll work with the local provider on a fix or a timeline for restoring service. Internet speed and availability can't be guaranteed in this rural area.", "image": "PLACEHOLDER: Photo of the Wi-Fi router location (or network label)", "link": "", "linkLabel": ""}, {"section": "explore", "title": "Three Rivers", "body": "Three Rivers is the gateway community to Sequoia National Park, with restaurants, coffee shops, river access, hiking and beautiful scenery year-round. Road, weather, river and park conditions change with the seasons, so please check current conditions (nps.gov/seki for the park) before heading into the park or planning outdoor activities.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Coffee & Kitchen", "body": "You will find a DeLonghi combination espresso and drip coffee maker and a French press in the kitchen, along with an electric kettle for hot water and complimentary coffee, tea, and sugar to get your mornings started. The kitchen is fully stocked with cookware, utensils, and basic spices. If you run the dishwasher, please use the provided pods located under the kitchen sink.\nPlease use the range hood when cooking. Opening a nearby window also helps when you're cooking something steamy or smoky.", "image": "data:image/webp;base64,UklGRt69AABXRUJQVlA4INK9AAAQJAOdASrQAh4CPsFUo02npCOyKfN8IkAYCWVpqsJVD13ES/C7LaQ4lcHCjfLB/ldOZmvyq/DR/WVI9gDZHByElXNsOIRnLtN+B91w6S7BT7VewBxjc/b/pegjR9/4PH5/4rFX/2PrU+2fsSbfxx+t85N9f1Sf3H1sPMh6w/7J0QGny/yfptPTAx1j6H47PpH3W/Ljz7/Sveo3A71/0Hg//bPml69e1P99/x/Qd/XfJM/t7tXjPMj+EM4v+Lz6/j/UC/W3/s+yv/r8hr8r/5f21+A3+k/5b9rPeb/8fPP/Af+DgvH4UkfNvpjgrOLKV5LqC6iLgCwMUJm0zLMcBPfc7OkEXo1F2u8PPHHg6RJCWhEJIh9aP1H4h3zqSsWGAj/YOLe+Yd7/DpNwvR4KOcIvJytj2sv8SyvVP7fNlLUtp6bn7R+a5UWFriatBeuPs4Nw4mw5GYa59bzNkLB0cq0NWeAOA/k6noEtFl+O0G5tErEgBdkUhrEMssNPCEZu4+5H0wS/tfCZ4JoblnrbLZS3KrBnW9R4MAt4mmMtgrz+QvM1jEGZmUOPmW/y6umxU/IavOT1wmCOoeMTeQ9FHh31IwqTbF0eOfmq9JijYlXBLNsTSHnyBr/28vheidq2jLpw/i9Uke6NoOqVkZkDWMi3Go72Mzbabq9oBrQ7111NAEzeCKnzOhZS6XvBWCt4swpd50HXOHK9+BE7SzFubcEe7Hkc3HKXXlkabNvDtZHJsCzU8a8RdidP6GEj+z6nGPziRHh98KE8Fd1q4yJuR5vx3zZe4Cpbu9Z+IjmKSycJWWWSjByoJ7HI7jnTkSTFln+iT8eJVMKE7qlvBw8w84G/urhSjayp24Db+MD08PbpI7bvgokjsumPU8/rCqdvVh4iW7E8hx9xaOAlQdI4zC4u7BjwvBHZoMa3F6/W9Ucwxc/3CfzcU7NJnlPIK+qR13vfZ94h2gWvGud0EwV59FJRnFkz6Gne5qtxK0JuXw5kTIu21+vVVOou4JgcDPXD7uop585kG7kbwfQgujRFbsWzaCGX1GokamDFJayfQFLzpH1lHqblHJQ7cvTOHQ6ZAjiHIFUwzdElzww+oUrVFWtj3dRc3sDoE0YMxMXNFfCfzUTmhnE77HIKmztCejniZhDgZwv1OaZYqpH+RSdZYzwCAOuc8lO  from there.\n> Leftover food: Unopened food and drinks you can't take home can stay in the fridge, and our team will make sure they go to good use.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Driving directions", "body": "Enter 40852 Blossom Dr in your GPS. From Highway 198 / Sierra Drive, turn onto Old Three Rivers Road. About 300 feet before the end of the road, turn right onto the dirt road marked by a blue 40852 address sign, opposite a wooden cabin with a white old-fashioned lamp post. Drive no faster than 10 MPH. After about a quarter mile, keep left at the fork. At the roundabout, turn left through the rock-cage gate, then continue to the carport.", "image": "PLACEHOLDER: Photo of the turn-off: dirt road with the blue 40852 address sign", "link": "", "linkLabel": ""}, {"section": "home", "title": "Trash bins", "body": "Wildlife is common in Three Rivers, and bears are strongly attracted to food and trash. Keeping the bins secured protects the neighborhood and keeps wildlife from becoming dependent on human food. The bins are at the end of the driveway, on the side by the entrance.\nGrey bin: trash and food waste. Put all food scraps, food packaging and anything with a smell here, and close the lid securely, especially at night.\nBlue bin: recycling. Bottles, cans, cartons, glass, clean cardboard and paper only.\nGreen bin: yard waste. Leaves, grass clippings and other garden waste only.\n> Bear safety: Please don't put food waste in the blue or green bins. They don't lock, and bears will make a mess. Please leave the bins where they are. Our team takes care of trash pickup on Tuesdays and Wednesdays.", "image": "data:image/webp;base64,UklGRg54AQBXRUJQVlA4IAJ4AQBwnQOdASqAAuIBPmkmjkWkIiEZzQ6kQAaEpn/f5uaBDeZJyeku/Ks4vsr1//O9Oj+/3H/Q/93zRPeO+f/3P/f/u/9B8PP7D/vP/l7hf9a/yX7Ce5j/5fuR7/f8L/5vUr/XP9j+2fvL/+P9w/ex/jPUJ/xn+761/97/Yc/oX+o/+/tK//X95/h5/wH/s9MD//+wB///bn1AnhR+e/LHzH8eHxL91/0P7Kfv39lf3d/1f6vv0euf137b+oX9F/OH+L/Me0b+G/9f+e8 kAG0uBAxO1y/30dUeyJyJpdpoiJQXIAioBR5pmIo192xfFQiScF1I3T2jicAlnY/C5AWRTLIgAAA=", "link": "", "linkLabel": ""}, {"section": "explore", "title": "River Island Nature Preserve", "body": "River conditions change, and crossing the river can be dangerous, especially in high-flow periods. There is no lifeguard. Please check the water level before you go and use extra care.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Dishwasher", "body": "Please use one dishwasher pod per load. The pods are in the cabinet under the kitchen sink.\nLoading: Scrape off large food scraps, but there's no need to rinse. Please don't overload it, and leave space so water can reach everything.\nSize: Make sure nothing is too tall or too large to fit, so the spray arms can turn freely and the door closes fully.\nNot in the dishwasher: Please hand wash cast iron, sharp knives, wooden items and anything not marked dishwasher safe.\nRunning it: Place the pod in the dispenser, close the door, choose a cycle and press start. If it isn't draining or running properly, please message us.", "image": "", "link": "", "linkLabel": ""}, {"section": "wifi", "title": "TVs & streaming", "body": "There are TVs in the living room and the master bedroom.\nTurning on: Use the TV remote to power on, then choose your streaming app from the home screen. If the screen is blank, check the input or source button on the remote.\nYour accounts: You're welcome to sign in to your own streaming accounts. Please sign out of every app before you leave, so your account and viewing history stay private.\nSigning out: Open each app's settings or profile menu and choose Sign out. If you're not sure how, message us and we'll walk you through it.\nRemotes: Please leave the remotes in the room where you found them, and let us know if the batteries need replacing.\nNot working? Check that the TV is on the correct input and that the home Wi-Fi is connected, then message us if you still need help.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Parking & private roads", "body": "The driveway fits 4 to 6 cars. Please park only in the designated parking areas, and don't block the private road, neighboring driveways, gates or access areas. Please drive no faster than 10 MPH on the private roads, and respect neighboring properties and their privacy.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Check-in", "body": "Check-in starts at 4:00 PM. You'll find the gate code under Your gate code below. The front door is left unlocked for you, and your key is waiting on the kitchen counter.\nEarly check-in and late checkout aren't available unless arranged with us in advance.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Guest count & pets", "body": "This home sleeps up to 12 overnight guests. Please make sure your reservation lists every guest, including children and infants. Guest counts must be accurate. Additional guests need advance approval and may result in added fees.\nPets are welcome only with advance approval, up to 2 per home. Some breeds aren't allowed, so please ask before you book. A $150 pet fee per home is due before check-in. Please bring your pet's own bed. Approved pets must stay off beds, couches, furniture and mats, and any accidents should be reported. Excessive shedding or damage may result in additional charges. Please keep pets under control and close by when outside because of the wildlife, clean up after them, and don't leave pet food outdoors.\n> Unapproved pets: Pets that aren't approved on your reservation may result in fees under your booking platform's policies.\nVerified service animals are always welcome. We kindly ask that you let us know ahead of your stay, but it isn't required.", "image": "", "link": "", "linkLabel": ""}, {"section": "wifi", "title": "Heating & cooling", "body": "Your home has a smart thermostat linked to your reservation, so it's already set up for your stay. It's set to keep the home between 70 and 75°F and heats or cools automatically as needed. You're welcome to adjust the temperature up or down to your liking. There's nothing to reset when you leave.\nKeeping doors and windows closed while the heating or cooling is running helps keep the home comfortable.", "image": "data:image/webp;base64,UklGRtwkAABXRUJQVlA4INAkAAAw6gCdASomAmwCPkkkkUYioiGnoVN4uPAJCWlucvTqyjDANjUi5s7uiP8Z2oERGLVJG/e5F8fX+DhD180j5q1h646jHpV7Xr9d65eUX6ePmA/SX/Vf2v3t/Rf6AH7D9YX+zPsAfsd6TH7W/Bb+137VezV/+taB92+kfy7/N9Mj6O9rP3a0if5R9zv0XzSffDuh+X2oR62/y3zb8vWAL6v/73+/8lH2o9gP9S/976++LP97/6vsCfz/+/fsv7Iv1V+UfvX+pv/V/n/gU/nP9y/5PYr/db2Sf27C/JGdwtn4hGWqt8eV6cREIWlb48r0Wuoz//+xRsiebs0TMmEp/MOfPIDSvHUGzfzf3Zd8GxLdzWHaAtVDagT7/1IfKxpH/73dgEYyvN0sPWYkllkCoIHVi0djns4n/rGyiEd8ahOvOmdb9E4FafjK5Ji9BzV6C/TujYwKEKLw5fyVuEOcK0IrW4c0u5eB9tWd1PwAOqPYEpRcazRCsZ/6smbt/X8ummdc/J9WI7b4OtodHZcRqoG5XlBVeYekiiZ4iQonN9sPTsyhx/9lyIf/KrD77V2aMgaCccKqpIgofqSAnC5iDN2BajRX5V4M4U4Sty67MWDZGIEGuoWY9bzNEieqhHBU8edLGqe8DAkoQgoVnrI2dPWdbdAFu2wF8JmgjzD2XIfL9jF5ZaxX0XDuJw9JNNWxbWiMIR2t7Uo8wVpMnYBP3CoeWUHCXPAwbitdqMVW+5Q5I2NV4Anse/ohNwrWAR9nmpZ99IRadnHgWIhzz8KH126fDxyCWtDBPDO0X2L2mMZrioeipUGOmsfkeNgEyzfSQKKi68gJ6yZ5+40N9yfqfOZm+/cM4C4pUkdFnwc6YW4pNJgkWOmC7bUiG1TYKIcYTPJZ6p4vfkfo3f/B3umh2r01GsxzcK8TSN6b27ZqLfus92pd3rXIjORbFDDtd9wkwfj/i2XC0E+lZyWB0rDjHO6j5Bjspq91oXTP6/cNw7SdjVVUAUpymWZUzkSB7kXOrVoXZHwwR+eoUj64l0m7DT5qznZ0uyg4bs8vbSZ5t9nmzsb//Ks4rPEjRPmHoZBtdOpEvyx6szj0abJOXh0/M35jUFm4uJW6w69nueEF7CJh2/2BLk4JviZvLiNdBL3jMxk+5hEinWw+fF5xk8O3ytGyS6L8X1unwoysYjidzzv8qMJSZFrCa3OAvNjiTq/tXq7gL/Qhra40vdj/QJ69VlDL/HJTjxGWCzyjKBMleGiixsfg4Vsy6KiAPmL0VQZ/B1xKbiv7s0CbI5c8dcWwrzG7T9wuMRFVD30ZXEU7Zm89ekKN2UL057rNIhmE73JOcPtvfbpJIq3zF7HZAQqZsQa4GMvQ9Bom3bSkSOToG08LT4R4oFGVSliynAHsw371uIJKwwQVWKt0SOjhkrNaYYVV4+uFAXggvJjI7WeFn1WEeoLA7kPe7p3twMOWlCKDetNCdjXw22eJkuTedJaZpYTkXfPq91wXrRbJ+jCUtOet/Bcpr+rRE2QHBI7fU5oqdwFrPsvGia0cZHxb+WCiv5XBWL/d+Szd4PtOwj3+9u8FMkUHKgxcUa6AHvTtk+POKti0XefH0 dryer during your stay. Laundry pods and dryer sheets are provided on top of the washer. The iron is in the drawer on the right at the laundry room entrance.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Bath & home supplies", "body": "We provide shampoo, conditioner, body soap and hand soap, plus dish soap, dish detergent, dishwasher pods, laundry pods and dryer sheets. You're also welcome to bring and use your own soaps and products.", "image": "", "link": "", "linkLabel": ""}, {"section": "checkout", "title": "Commonly forgotten items", "body": "Most commonly left behind: phone chargers, glasses, jewelry, water shoes, jackets, children's toys, and food in the fridge or pantry. A quick look around the outlets, bedside tables and closets is usually all it takes.", "image": "", "link": "", "linkLabel": ""}, {"section": "explore", "title": "Swimming & river access", "body": "River Island has natural pools right in front of the home, and river time is always a highlight. River levels and temperatures change with the season, so check conditions before you go in, and keep a close eye on children. Wear water shoes and any safety equipment you need, such as life jackets. There is no lifeguard, and swimming is at your own risk.\nLooking for another spot? Locals also swim at a spot inside Sequoia National Park, near the visitor center. Ask us for directions.", "image": "", "link": "", "linkLabel": ""}, {"section": "checkout", "title": "Left something behind?", "body": "Please message us as soon as you notice something is missing so we can check the home. If we find your item, we're happy to mail it back to you. Return shipping and handling costs are the guest's responsibility.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Hapé ceremony", "body": "A gathering at the river's edge, about an hour long, with a grounding meditation and the rhythm of the drum. Hapé is a traditional Indigenous Amazonian snuff made from ground tobacco and other plants, offered with reverence and intention.\nIf you like, you may bring a journal and a small offering for the altar (a crystal, a feather or any token of gratitude). Comfortable clothing is best, and many people prefer to fast for about three hours beforehand. One person is enough to book.\nParticipation is always optional. If you have any health concerns or questions, please ask us beforehand.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Lights & switches", "body": "Please be mindful and turn lights off when not in use or during daylight hours.\nNight lighting: Keep a flashlight or phone light handy for paths, steps and the river, as the property is dark at night.\nNot sure which switch does what? Please message us and we'll happily help.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Damage", "body": "Please report any accidental damage promptly. Guests are responsible for damage caused during their stay.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Cancellations", "body": "For cancellations or changes, please refer to your booking platform and the cancellation policy shown when you booked. We recommend travel insurance for every trip.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Sound healing & medicinal chant circles", "body": "Gather for sound healing and medicinal chant, a gentle way to relax, release and reset during your stay. Ask us about availability and group size.", "image": "data:image/webp;base64,UklGRsLSAABXRUJQVlA4ILbSAAAwdQOdASowAmcCPtFWokyoJKOtrRfNabAaCU129mt56del2mrxvGRU35nMAigDZG+gFLS2sOJXhPqukTc8n33OolZfVP5hS88r+mv9LSpymenc8P3Pvhenj+xbynzb+bT6if65v1G9Q/2/Hs5TPmH8/3x/m32j/W/xvor5I/df8jzO/AH/X1k/4PgP869RTzZ6dsOnsd+x6HHxRlt/u+hH7f5WX7ocwZ++9Q7/G+j1/0+Zz9k/7H7rfAv03PScCFW/3p8HjUFaCI74iEv2yGLO7b4NNgMyeJAlCiReXMpMPYYuD/MHIraBhMfU+wt1rTZPJ4I7AepbqVPZK3ejL+/TeneRqLpAuIVoLu2HzbXoJdD5CbW99xv y, then message us to confirm the discount, and we'll refund 10% on the first day of that stay.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Your gate code", "body": "Your gate code is 1234. At the gate, press Reset, enter 1234, then turn the knob.", "image": "PLACEHOLDER: Photo of the gate: keypad/knob area showing the Reset button", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Front door key", "body": "The front door is left unlocked for your arrival, so you can walk right in. Your key is waiting on the kitchen counter.", "image": "PLACEHOLDER: Photo of the front door and where the key sits on the kitchen counter", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Limited cell service", "body": "Cell service can be limited in Three Rivers. Please save your arrival instructions and Wi-Fi details before you travel.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Safety equipment", "body": "For your peace of mind, fire extinguishers are located under the kitchen sink, in the pantry and in the laundry room, and a fully stocked first aid kit can be found in the bathroom vanity. A plunger is also available in the bathroom.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Breathwork healing", "body": "Guided breathwork to calm the mind and open the body. Ask us about availability.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Shoes", "body": "Please remove your shoes indoors.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Off-limits office", "body": "The office by the carport is off-limits to guests.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Online sessions & retreats", "body": "Want to continue the journey at home? Reyium offers 1:1 online sessions and retreats. Visit reyium.com to learn more.", "image": "", "link": "https://reyium.com", "linkLabel": "Visit reyium.com"}, {"section": "home", "title": "Grounds & maintenance team", "body": "Our grounds and maintenance team looks after our Three Rivers homes, and you may see them nearby on weekdays, usually between about 11 AM and 4 PM. They might be doing yard work, emptying trash cans or light maintenance, and we plan their work to stay out of your way. If you ever have a question or want a quiet day, just send us a message.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Forest bathing", "body": "Forest bathing (Shinrin-Yoku) is a slow, mindful walk among the trees, focused on breathing in the forest air and noticing the sights and sounds of nature. Message us for more information.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Kambo ceremony", "body": "Kambo is a traditional ceremony that uses a natural frog secretion from the Amazon. Message us for more information.\nParticipation is always optional. If you have any health concerns or questions, please ask us beforehand.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Mountain e-bikes", "body": "Explore the roads around Three Rivers and Sequoia on two wheels. Mountain e-bikes are available upon request (up to 3 bikes). Please request your e-bikes well before check-in so we can confirm availability. Inside Sequoia and Kings Canyon, bikes and e-bikes are allowed on roads but not on hiking trails. Message us for more information.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Group sound baths", "body": "Group sound baths are available for up to 20 people. Let the calming sounds wash over you. Message us for more information.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Private chef & massage", "body": "Would you like a private chef or an in-home massage during your stay? Please check with us for availability and options.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "How to book an experience", "body": "Message us through your booking platform, or text Georgel at 818-400-2669 to ask about availability and details.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Events & extra guests", "body": "Events, parties, weddings, professional photography, filming and other gatherings must be discussed with us and approved before you book. Unapproved events may result in cancellation without a refund, removal from the property and additional fees under your booking platform's policies. Private family dinners are always welcome.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Mid-stay housekeeping", "body": "Mid-stay housekeeping is available for an additional fee with advance notice, ideally a few days before your stay. Message us to arrange it.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Spa / hot tub", "body": "This home has a hot tub. There is no outdoor shower at this home, so please shower inside before getting in, especially after visiting the river. Dirt and sand can damage the filtration and jets, and a cleaning fee may apply if excess dirt or debris is found in the tub.\nKeeping it clean: Please keep sand, dirt and shoes out of the tub, use non-glass drinkware around the spa, and keep the cover closed whenever the tub isn't in use to keep the water clean and the heat in.\nTemperature: The hot tub is preset to 102 to 104°F. You're welcome to adjust it to your liking.\nCare & chemicals: Our caretaker looks after the water, chemicals and cleaning, so there's nothing you need to add. Just enjoy it.\n> Something look or feel off? If the water looks cloudy or unusual, smells strong, or the heat or jets aren't working properly, please contact us right away and we'll send someone from our team to take a look.\nChildren under 12 are not permitted in the spa. Ages 12 to 17 need continuous adult supervision, may not use it alone, and may not use it at night. Please monitor all children closely.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Piano", "body": "The piano is here for you to enjoy. Please play gently, keep food and drinks away from it, and respect quiet hours (10 PM to 8 AM).", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Yoga room", "body": "The yoga room is a quiet space for stretching, breathwork or meditation. Please keep shoes out of the room, and leave anything you use where you found it.", "image": "", "link": "", "linkLabel": ""}, {"section": "explore", "title": "Fishing", "body": "A California fishing license is required for anyone 16 and older. Short-term and annual licenses are available. You can buy one online from California Fish and Wildlife before you arrive. Rules and seasons vary by water, so please check current regulations. The river is low and slow much of the year and isn't a dependable fishing spot. Lake Kaweah nearby has bass, catfish, crappie and trout. Please take all line and hooks with you.", "image": "", "link": "https://licenses.wildlife.ca.gov/internetsales", "linkLabel": "Buy a fishing license"}, {"section": "guidelines", "title": "River & outdoor safety", "body": "Please use care around the river, rocks, trails, steps, decks and rooftops. River conditions can change dramatically through the year, rocks can be extremely slippery, and there is no lifeguard. Water shoes or secure footwear are strongly recommended. Please use non-glass drinkware near the river and outdoor areas, supervise children closely, and never enter the water when it looks swift, deep or unsafe.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Tesla EV charger", "body": "This home has a Tesla EV charger, and you're welcome to use it during your stay. It works with Tesla vehicles directly. If you drive a non-Tesla vehicle, you'll need your own adapter to use it. Please hang the cable back on the holder when you're done.", "image": "data:image/webp;base64,UklGRt6wAQBXRUJQVlA4INKwAQCwVwSdASrQAh4CPq0+lUqmIyGht11AwBWJaGZdbeH1QDcydTLJf0EK/DD0fLv5r82s/Pjo/2d5f0H/a8zD3Hv1/+b1q/2b/d+wN/XPRL6df8X/7/Uh+5/rF+nD/Feob/if/H653q0eg9+4frFf/b2ev8L/7f3j9tf1AP//7d3M/wDfNP3L/ZeBP5f9K/uf7z/nPv5+yX7r+qO/H7J/SftV6if0L81ekf3//7XzK/mv/d/pPFX5F/TXsEfnP9k/9H5//9r4Pvrf3C7tDY/9V+3XsEe8f4b/9ehz9v5ofsf+o9gP+mf47/+f7X/m++f/c8JL8j/2/YE/Z3q4f7H/+8yX7D/y//9/zfgN/qv+s//f++7Y/pYkskY9Uax9VafszaBbbUIHmUMwW/XkM09G0lgTyjWSoBHrui617UAVu/NzpwHCPL/Ke4pTHBFsZOmpaTYwnHXHX68Sp7TY9gtO/+wp/Why6wB2WRswtQCdnpu/AquRNpRS/pMCd56Z9MUnV5zeSAgDekLbL8k2kKzL23w9PB4By7xpycswrFL9uI/C+fFwfHmVIhzbWc8cW8gJRCGcpl7DYI+Qliv0182JJa25tgaLXZFBePZEukeZ0LP3hhtdRa/wj6fEYneXOxkfumvUq58D6CdUwA/2dutlJP5nWDTRKumcJJmilJUgzVajYjGmnfbTmg4xt4Zc9aLxvA3dEKlbwu9J52euaK6exlspgU99KpTOEAfu+BuyDd5yK1Q7qOVZXRSqHiLDdprmmtfGzbxftp0b1LSLAqAvEPU3eT8lh7UpE9YSiq2EO4IsFzCK0ObwBwd8u3BzXqvDQDXpymqza79gZlJcDi16xpCkJnP0tPEwcEOPYZHnMc5up8mi53HoPtDl4tH8Z3yiCaHqpgWJPDP/92SMD5gPPf5K/DxxNKlwllAvGSJziCU+oG2Uy24uqFguEXcZLAXyICw/u1+LIWiA5fc5/7pd/9r095aovHi8PX+ymd1q0EzXKu+L881JX6Ex2vMgc8r0HoklkoVSrbCa6zkoTnKcs+h+uOJ5EA/Htkt2aKIZRFzPEG7uF9QmPLbsHGPM9b8dSJ0K6SDx33l9zd7/WYqN/Yt4OANTwLoxhW8ov+daCnhq43tljuzqfVKdh7JX1SjkuOXeT7LLzBMqO1N5OelM9ecOycuNaKpPFSCvdujm4qHyfe11QjMCfa88OeD8ah3vFfCfgHn/yMLavhfec9BED2Jgx3Snk9NBnoITZcd3nyYPNvjbwcx1/r25kS4RRPPMzDesVsJploOUP9H6pjpmODKqqtHvSbzKkjaP9XQpiTS5YtI98LMxHsa4/prrNg9pbT+yMWORQ20QxV1y5vuG1tY2Qm2vzYycsmK2MGuUbdGmOubMGefYoatlRKieiPsPcg93ifmMrVl2CQL6qomcnUb9I9aZ+q45eLkJytV/HQs39o/mW9G6nZ+qaL2JH5FXHoX7XL1nqk+Zl7LE3F3uYBpDrSslXpeST/ZSHOD0U65GBa4toW8B0yZwX7+ZMMpw/lWRCgDqPi7a1ub8Un5K9z4QkhxX8/AyyrkUWy/O/I2PkETJb5IbighLm7S9t8G5tWhf3IXrlf2SguIEQY4k1eWae/hf+9Uftqw7DTsVBs2HibylFxeS/WHXj+HOxPpsX+ij60//S2/ehs4vOHkE+Yy8ClgP9jXd0lefb0GxOlCCV/96XtFsuS3zCepfVmgt72rnmJuzgjvOXtBYHkeR5PR6VcmKvw6/zEa3Ubh5sLdOaMeer3LcjfCOQ4zJ6+pvnjqPAqNM1AnjQb6qL6RNJ5tsMNhiS6zzXDX/xHGRM7vDZ7N3jUJwlGmhrHivEu/Bn0vKVjB8/h20Iw5+L3jeS dining table are provided. You'll find them in the laundry room cabinets.\nA high chair is available on request, but supply is limited, so please message us ahead of your stay if you'd like one.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Rooftop observatory", "body": "The rooftop observatory is a favorite spot for sunset and stargazing. Please enjoy it with care.\n> Children: Children must be supervised by an adult at all times and may not be on the roof unattended.\nGuest count: Please keep the group on the roof within your reservation's maximum guest count.\nFire & flames: No fires, candles, torches, grills, fireworks or open flames of any kind. Smoking and vaping are not permitted.\nRailings: Please don't climb, sit or stand on the handrails, and don't hang anything heavy from them.\nFurniture: You're welcome to use the rooftop furniture. Please move it gently, keep it away from the edges, and leave it where you found it.\nGlass: Please use non-glass drinkware and take all dishes and trash back inside with you.\nWeather: Please come down during high wind, storms or lightning, and when surfaces are wet or icy.\nNight visits: Bring a flashlight or phone light for the stairs, watch your step, and keep voices low during quiet hours (10 PM to 8 AM).\nSound: Please keep speakers off the roof so sound doesn't carry across the river.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Septic care", "body": "The home uses a septic system. Toilet paper is fine in reasonable amounts. Please don't flush wipes (even ones labeled flushable), diapers, feminine products, paper towels, cotton pads or anything else that isn't toilet paper. Where you can, use natural or eco-friendly products down the drains, and please avoid pouring harsh chemicals or oils down them.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Wildlife", "body": "Keep food and trash secured to avoid attracting bears. Enjoy wildlife from a distance, and never feed or approach animals. Bears are common here, so please follow the bear safety notes in your home's trash bin instructions. You may see squirrels, deer, black bears, mountain lions and many birds, including western tanagers, violet-green swallows, western bluebirds and pileated woodpeckers.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Security", "body": "Please lock the exterior doors whenever you leave. For everyone's security, please don't share your door code, gate code, keys or other access information with anyone who isn't part of your reservation. If you have trouble getting in, message us rather than forcing or tampering with a lock or door.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Rural mountain living", "body": "Three Rivers is a rural mountain community. Power outages, road closures, wildlife activity, river conditions, weather and seasonal fire restrictions can occasionally affect the area. Because cell service can be limited, connect to the home Wi-Fi after you arrive and keep the property address handy.", "image": "", "link": "", "linkLabel": ""}], "local": [{"category": "Parks & Outdoors", "name": "Sequoia & Kings Canyon National Parks", "description": "Giant sequoias, canyon views and hiking. The Ash Mountain park entrance is about 10 to 15 minutes from the home (travel times vary). Please check nps.gov/seki for closures and current conditions before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Sequoia+National+Park+entrance+Three+Rivers+CA", "image": "PLACEHOLDER: Photo of giant sequoias or the park entrance sign"}, {"category": "Parks & Outdoors", "name": "General Sherman Tree & Giant Forest", "description": "The world's largest tree by volume, in a grove of giant sequoias in Sequoia National Park. Allow about an hour to drive up from the home, plus time to walk the trail. Please check nps.gov/seki before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=General+Sherman+Tree+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of General Sherman Tree & Giant Forest"}, {"category": "Parks & Outdoors", "name": "Moro Rock & Crescent Meadow", "description": "A granite dome with steps up to sweeping views of the Great Western Divide, and a peaceful meadow walk nearby, both in Giant Forest. The road generally opens by the Wednesday before Memorial Day and closes once snow makes it impassable. From about late May to early September, it's closed to private vehicles on weekends and holidays during the day, and a free shuttle runs from Giant Forest Museum. Please check nps.gov/seki before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Moro+Rock+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Moro Rock & Crescent Meadow"}, {"category": "Parks & Outdoors", "name": "Hospital Rock", "description": "A picnic spot by the river with Native American pictographs, about 15 to 20 minutes past the park entrance and the Foothills Visitor Center at Ash Mountain. A peaceful first stop on your way into the park.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Hospital+Rock+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Hospital Rock"}, {"category": "Parks & Outdoors", "name": "Lake Kaweah", "description": "A reservoir about 10 to 15 minutes from town toward Visalia, which you pass on the drive into Three Rivers. Good for fishing, picnics and birdwatching. Water levels and fishing rules vary, so please check before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Lake+Kaweah+Lemon+Cove+CA", "image": "PLACEHOLDER: Photo of Lake Kaweah"}, {"category": "Parks & Outdoors", "name": "Park visitor centers", "description": "Foothills Visitor Center, just inside the park entrance near Three Rivers, is a good first stop for maps and trail advice. Lodgepole Visitor Center is deeper in the park, near the giant sequoias. Please check nps.gov/seki for current hours and details.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Foothills+Visitor+Center+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Park visitor centers"}, {"category": "Parks & Outdoors", "name": "Kings Canyon National Park", "description": "Sequoia's neighbor to the north, with the giant sequoias of Grant Grove and the deep Kings Canyon. It's a longer drive from Three Rivers, so many guests make it a full day. Please check nps.gov/seki before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Kings+Canyon+National+Park+Grant+Grove", "image": "PLACEHOLDER: Photo of Kings Canyon National Park"}, {"category": "Parks & Outdoors", "name": "Mineral King", "description": "A remote alpine valley at the end of a narrow, winding, partly unpaved road, with trails and wildflowers. The road is open seasonally, generally from the Wednesday before Memorial Day to the last Wednesday in October. RVs and trailers aren't recommended, and weekday construction closures are planned through 2027. Please check nps.gov/seki before planning a visit.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Mineral+King+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Mineral King"}, {"category": "Parks & Outdoors", "name": "Silver City Mountain Resort", "description": "A seasonal mountain resort on Mineral King Road, about 3 miles before the Mineral King Ranger Station, known for its pie. It's open in the warmer months, so please check before you make the trip.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Silver+City+Mountain+Resort+Mineral+King", "image": "PLACEHOLDER: Photo of Silver City Mountain Resort"}, {"category": "Dining & Coffee", "name": "The Gateway", "description": "Riverside restaurant and lodge overlooking the Kaweah River, with American dinners an function renderSearch(parent) {

function renderHome() {

function renderSection(id) {

      var c = el('div', 'card'); c.setAttribute('data-t', l.name || '');
      c.appendChild(el('h3', null, l.name));
      if (l.image && /^PLACEHOLDER:/.test(l.image)) {
        if (DATA.showPh) { var lph = el('div', 'phbox'); lph.appendChild(el('span', 'phi', '\uD83D\uDCF7')); lph.appendChild(el('span', 'pht', 'Photo needed: ' + l.image.replace(/^PLACEHOLDER:\s*/, ''))); c.appendChild(lph); }
      } else if (l.image) { var lim = el('img'); lim.src = l.image; lim.alt = l.name || ''; lim.loading = 'lazy'; c.appendChild(lim); }

  var f = document.getElementById('flag'), im = location.hash.match(/i=([^&]+)/), want = '';

  var tgt = null;
  if (want) { var cs = document.querySelectorAll('.card'); for (var q = 0; q < cs.length; q++) if (cs[q].getAttribute('data-t') === want) { tgt = cs[q]; break; } }
  if (tgt && tgt !== f) tgt.className += ' found';
  if (tgt) tgt.scrollIntoView({ block: 'center' }); else if (f && im) f.scrollIntoView({ block: 'center' }); else (window.scrollTo(0, 0), document.body.scrollTop = 0);
}

function toTop() { try { window.scrollTo(0, 0); document.body.scrollTop = 0; document.documentElement.scrollTop = 0; } catch (e) {} }
function route() {
  if (DATA.mode === 'directory') return renderDirectory();
  if (DATA.mode !== 'guidebook') return renderNotFound();
  var m = location.hash.match(/s=([\w-]+)/);
  try { m ? renderSection(m[1]) : renderHome(); } catch (e) { try { location.reload(); } catch (e2) {} return; }
