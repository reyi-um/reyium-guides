op of this guide, wood fires are not allowed. We provide a limited amount of firewood. Please keep fires small and attended, and make sure they are fully out before you leave or go to bed.\nPlease never discard cigarettes, matches, charcoal or other burning material outdoors, and stay with the BBQ and fire pit whenever they are lit.\nInside the home, candles, incense and other open flames are not permitted, other than fires in the wood-burning fireplaces when they're available.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Quiet hours", "body": "Quiet hours are 10 PM to 8 AM. Outdoors, please keep noise down out of respect for the neighbors and the dark night environment.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Address", "body": "40922 Cherokee Oaks Drive, Three Rivers, CA 93271", "image": "", "link": "https://www.google.com/maps/search/?api=1&query=40922+Cherokee+Oaks+Drive+Three+Rivers+CA+93271", "linkLabel": "Open in Maps"}, {"section": "wifi", "title": "Wi-Fi", "body": "Network: Reyium\nPassword: 3RiversHealing\nInternet outages: If the internet goes down, please message us as soon as possible. We'll work with the local provider on a fix or a timeline for restoring service. Internet speed and availability can't be guaranteed in this rural area.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Hot water", "body": "The water heater comfortably handles about two showers at a time, so staggering showers keeps everyone's water hot.", "image": "", "link": "", "linkLabel": ""}, {"section": "explore", "title": "Three Rivers", "body": "Three Rivers is the gateway community to Sequoia National Park, with restaurants, coffee shops, river access, hiking and beautiful scenery year-round. Road, weather, river and park conditions change with the seasons, so please check current conditions (nps.gov/seki for the park) before heading into the park or planning outdoor activities.", " ate bins, check that the windows are secure, and lock the doors when you leave. If you used any dishes, please leave them in the sink. There's no need to wash them, and running the dishwasher is optional. There's no need to strip the beds, do laundry or follow a cleaning list. Our team takes it from there. Let us know promptly about any important problems.\n> Leftover food: Unopened food and drinks you can't take home can stay in the fridge, and our team will make sure they go to good use.", "image": "", "link": "", "linkLabel": ""}, {"section": "checkout", "title": "Commonly forgotten items", "body": "Most commonly left behind: phone chargers, glasses, jewelry, water shoes, jackets, children's toys, and food in the fridge or pantry. A quick look around the outlets, bedside tables and closets is usually all it takes.", "image": "", "link": "", "linkLabel": ""}, {"section": "checkout", "title": "Left something behind?", "body": "Please message us as soon as you notice something is missing so we can check the home. If we find your item, we're happy to mail it back to you. Return shipping and handling costs are the guest's responsibility.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Towels & cleaning supplies", "body": "Extra towels are in the main hallway bathroom.\nThe broom and mop are in the laundry room, and cleaning products are under the kitchen sink.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Laundry", "body": "You're welcome to use the washer and dryer during your stay. Laundry pods and dryer sheets are provided in the laundry room.\nThe iron is in the wardrobe in the master bedroom, the large bedroom next to the kitchen.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Bath & home supplies", "body": "We provide shampoo, conditioner, body soap and hand soap, plus dish soap, dish detergent, dishwasher pods, laundry pods and dryer sheets. You're also welcome to bring and use your own soaps and products.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Wood-burning fireplaces", "body": "River Soul has two wood-burning fireplaces, in the main living room and the master bedroom. They're available roughly November through March.\nFirewood: A small amount of firewood is stocked indoors near the fireplace. More is on the deck, in the storage rack near the BBQ and living room door.\nLighting: Before lighting, make sure the damper is open. Build your fire with kindling and a few logs. Please don't use lighter fluid or other accelerants.\nSafety: Keep the screen closed whenever there's a fire, and never leave it unattended. Burn only firewood, never paper, trash or anything else. Please leave the ashes in the fireplace.\n> Before you leave or go to bed, please make sure the fire is completely out.\nIf anything seems off, such as smoke coming into the room, let the fire die down and message us.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Trash bins", "body": "Wildlife is common in Three Rivers, and bears are strongly attracted to food and trash. Keeping the bins secured protects the neighborhood and keeps wildlife from becoming dependent on human food. The bins are kept on the left side of the home, just inside the gate, lined up along the fence line.\nGrey bin: trash and food waste. Put all food scraps, food packaging and anything with a smell here.\nBlue bin: recycling. Bottles, cans, cartons, glass, clean cardboard and paper only.\nGreen bin: yard waste. Leaves, grass clippings and other garden waste only.\n> Bear safety: These are bear-resistant cans, so please make sure the lids are always closed and latched. Please don't move the bins to the street. Our team puts them out on Tuesdays and Wednesdays and brings them back.\nHave more trash than fits? Message us and we'll arrange to use a neighboring home's bins.", "image": "data:image/webp;base64,UklGRnj8AABXRUJQVlA4IGz8AADwFQSdASqAAlIDP itional guests need advance approval and may result in added fees.\nPets are welcome only with advance approval, up to 2 per home. Some breeds aren't allowed, so please ask before you book. A $150 pet fee per home is due before check-in. Please bring your pet's own bed. Approved pets must stay off beds, couches, furniture and mats, and any accidents should be reported. Excessive shedding or damage may result in additional charges. Please keep pets under control and close by when outside because of the wildlife, clean up after them, and don't leave pet food outdoors.\n> Unapproved pets: Pets that aren't approved on your reservation may result in fees under your booking platform's policies.\nVerified service animals are always welcome. We kindly ask that you let us know ahead of your stay, but it isn't required.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Kitchen", "body": "Please use the range hood when cooking. Opening a nearby window also helps when you're cooking something steamy or smoky. Before bed, please put food away and place dishes in the dishwasher or sink, because wildlife is very active here.\nCoffee & tea: A limited amount of coffee and tea is provided. If you have specific preferences, we recommend bringing your own.", "image": "", "link": "", "linkLabel": ""}, {"section": "wifi", "title": "Heating & cooling", "body": "Your home has a smart thermostat linked to your reservation, so it's already set up for your stay. It's set to keep the home between 70 and 75°F and heats or cools automatically as needed. You're welcome to adjust the temperature up or down to your liking. There's nothing to reset when you leave.\nKeeping doors and windows closed while the heating or cooling is running helps keep the home comfortable.", "image": "data:image/webp;base64,UklGRtwkAABXRUJQVlA4INAkAAAw6gCdASomAmwCPkkkkUYioiGnoVN4uPAJCWlucvTqyjDANjUi5s7uiP8Z2oERGLVJG/e5F8fX+DhD180j5q1h646jHpV7Xr9d65eUX6ePmA/SX/Vf2v3t/Rf6AH7D9YX+zPsAfsd6TH7W/Bb+13  whole group.\nFlatware & tools: Forks, knives, spoons and teaspoons, plus everyday cooking tools such as a spatula, wooden spoon, ladle, tongs, whisk, can opener, bottle opener, grater and kitchen scissors. A long lighter is also in the kitchen.\nKnives & boards: Chef's knife, paring knife, bread knife and cutting boards.\nBasics: Dish soap, dishwasher pods, sponges, paper towels, trash bags, dish towels, oven mitts, pot holders, hand soap, aluminum foil, parchment paper, and salt and pepper.\nOutdoors: BBQ grill with propane, and grill tools.\n> Good to know: These aren't provided at this home: bakeware (baking sheets, cake pans, casserole dishes), cast iron skillet, wok, Dutch oven, steamer basket, French press, toaster oven, air fryer, Instant Pot, rice cooker, mixers, travel mugs, teapot, steak knives, serving platters and bowls, pitcher, and cloth napkins.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Hapé ceremony", "body": "A gathering at the river's edge, about an hour long, with a grounding meditation and the rhythm of the drum. Hapé is a traditional Indigenous Amazonian snuff made from ground tobacco and other plants, offered with reverence and intention.\nIf you like, you may bring a journal and a small offering for the altar (a crystal, a feather or any token of gratitude). Comfortable clothing is best, and many people prefer to fast for about three hours beforehand. One person is enough to book.\nParticipation is always optional. If you have any health concerns or questions, please ask us beforehand.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Lights & switches", "body": "Please be mindful and turn lights off when not in use or during daylight hours.\nNight lighting: Keep a flashlight or phone light handy for paths, steps and the river, as the property is dark at night.\nNot sure which switch does what? Please message us and we'll happily help.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Damage", "body": "Please report any accidental damage promptly. Guests are responsible for damage caused during their stay.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Cancellations", "body": "For cancellations or changes, please refer to your booking platform and the cancellation policy shown when you booked. We recommend travel insurance for every trip.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Sound healing & medicinal chant circles", "body": "Gather for sound healing and medicinal chant, a gentle way to relax, release and reset during your stay. Ask us about availability and group size.", "image": "data:image/webp;base64,UklGRsLSAABXRUJQVlA4ILbSAAAwdQOdASowAmcCPtFWokyoJKOtrRfNabAaCU129mt56del2mrxvGRU35nMAigDZG+gFLS2sOJXhPqukTc8n33OolZfVP5hS88r+mv9LSpymenc8P3Pvhenj+xbynzb+bT6if65v1G9Q/2/Hs5TPmH8/3x/m32j/W/xvor5I/df8jzO/AH/X1k/4PgP869RTzZ6dsOnsd+x6HHxRlt/u+hH7f5WX7ocwZ++9Q7/G+j1/0+Zz9k/7H7rfAv03PScCFW/3p8HjUFaCI74iEv2yGLO7b4NNgMyeJAlCiReXMpMPYYuD/MHIraBhMfU+wt1rTZPJ4I7AepbqVPZK3ejL+/TeneRqLpAuIVoLu2HzbXoJdD5CbW99xvcXV8/Kk8L7n7uQugd9msgZBCJgdDbIMKpPip2r76K1rtwj3ne9Bw7sK7pVavJWHIV4UgIMGdNorvldXaOkACl4KmDTnRZdaF5oBm5/uCWLXG8EXFSIap7wpT1gs9ksIAEy+RBsWHeRKcXT1zag45LGqxkwDND3iCbi73Fq9R7GTgzeVAlZzLbZ/g2wghqYGTBH8BdQ7RIUdSS4TNPSNOBbmh3HQ9Bk5y2OAbywc20Mwsb4psTTUL+H+2W1wc0FFG5bf7crZxe1EykssJXw4d1kmdrWZVTs1m48/kgNRsLTnk6g3ZquOjKHUDl0gFmPh3ORFlh8KdNDFXWFvEG/MDL9xGWy0yyK7ntPrk9Y+mOQ1fcncs0nUGwqy3bpiPL2GydIZb6nVT2l+v1395wOmjPc0jZX3gKJq2nJOixMNTrBg2nuLZrqjtuvGmW35Jdn9pUzK3L/96P3Rq7ln/ryGH4jjlr/XG5CdjDNolDhm+D+EOseVcWq4JMwuRJ7tbrEL8SlHZ5t8qO3J/yHSBvbzbio2uPOoZ1S6N09MILST0ONynXHpPRm4Wog6d1tnd92HP4Cw0KXnAFUKPzXqbdmwVJcOcPL0oNus0Is8UJCSfSiF/8mlGTat74vp5jUhRKT8BaWWNFvqDxCygO2LmfcT9G6AvHf3zxlk8lQbqS1cw+xDvXEmvnqwL37Ir58sq2T1jkJqOSxYDEoihhvJAPUePuszXRt7Wkwcf1CPHLTj6Dn2mPUNY+E4oppyIkCYMsktq0kwAJVI9fMcS/C7uaDm6PSDZoL5du6tl7FfDOeHhRkzisAUDesd9rtW2ALfg9wq2ON3Gl3O/KE6ziGcvitzo  usually between about 11 AM and 4 PM. They might be doing yard work, emptying trash cans or light maintenance, and we plan their work to stay out of your way. If you ever have a question or want a quiet day, just send us a message.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Forest bathing", "body": "Forest bathing (Shinrin-Yoku) is a slow, mindful walk among the trees, focused on breathing in the forest air and noticing the sights and sounds of nature. Message us for more information.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Kambo ceremony", "body": "Kambo is a traditional ceremony that uses a natural frog secretion from the Amazon. Message us for more information.\nParticipation is always optional. If you have any health concerns or questions, please ask us beforehand.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Mountain e-bikes", "body": "Explore the roads around Three Rivers and Sequoia on two wheels. Mountain e-bikes are available upon request (up to 3 bikes). Please request your e-bikes well before check-in so we can confirm availability. Inside Sequoia and Kings Canyon, bikes and e-bikes are allowed on roads but not on hiking trails. Message us for more information.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Group sound baths", "body": "Group sound baths are available for up to 20 people. Let the calming sounds wash over you. Message us for more information.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Private chef & massage", "body": "Would you like a private chef or an in-home massage during your stay? Please check with us for availability and options.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "How to book an experience", "body": "Message us through your booking platform, or text Georgel at 818-400-2669 to ask about availability and details.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Events & extra guests", "body": "Events, parties, weddings, professional photography, filming and other gatherings must be discussed with us and approved before you book. Unapproved events may result in cancellation without a refund, removal from the property and additional fees under your booking platform's policies. Private family dinners are always welcome.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Parking & neighbors", "body": "Please park only in the driveway (it fits up to 3 cars) or on the street, following all posted traffic signs and markings. Don't block the road, neighboring driveways, gates or access areas.\nOur homes are in a residential subdivision, so please follow posted speed limits and be respectful of the neighbors and their privacy.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Mid-stay housekeeping", "body": "Mid-stay housekeeping is available for an additional fee with advance notice, ideally a few days before your stay. Message us to arrange it.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Tesla EV charger", "body": "> Coming soon: Your home's EV charger will be ready to use for bookings starting November 2026.\nThis home has a Tesla EV charger, and you're welcome to use it once it's ready. It works with Tesla vehicles directly. If you drive a non-Tesla vehicle, you'll need your own adapter to use it. Please hang the cable back on the holder when you're done.", "image": "data:image/webp;base64,UklGRnCvAABXRUJQVlA4IGSvAADwGAOdASrQAh4CPsFUoU0npKqoqPkM0VAYCWVt4yT6VgWcFfy59VOvYTdLP4P/1+jZ5Rs51mNvqLbQjNK+byIJgXEuk4kHPocv/O/+HToz1O8cGfCX6pNyR5qPNw84r0kuqk9B3plf79kDnzHydfN/6j/reFv5x94+fr/le8tlf958Evw9/09cf+N4R/sn9T6FP6x+7OBr4j/q+gvft4V/x3qCf4T0F8UT8X6j/lHd/792/8XsKftn//f+N24AdRGgU2r/eld8zxLfAMNonImOnv2HyjeWXKEXzXxHwiPUemKXJWqqj8TY4PibtWBUXgQI20s++ibNUfOUsLCMBQR9mE rout. Please take all line and hooks with you.", "image": "", "link": "https://licenses.wildlife.ca.gov/internetsales", "linkLabel": "Buy a fishing license"}, {"section": "guidelines", "title": "River & outdoor safety", "body": "Please use care around the river, rocks, trails, steps, decks and rooftops. River conditions can change dramatically through the year, rocks can be extremely slippery, and there is no lifeguard. Water shoes or secure footwear are strongly recommended. Please use non-glass drinkware near the river and outdoor areas, supervise children closely, and never enter the water when it looks swift, deep or unsafe.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Babies & little ones", "body": "A crib is set up in the master bedroom, and a booster seat for the dining table is in the wardrobe cabinet in the master bedroom.\nA high chair is available on request, but supply is limited, so please message us ahead of your stay if you'd like one.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Septic care", "body": "The home uses a septic system. Toilet paper is fine in reasonable amounts. Please don't flush wipes (even ones labeled flushable), diapers, feminine products, paper towels, cotton pads or anything else that isn't toilet paper. Where you can, use natural or eco-friendly products down the drains, and please avoid pouring harsh chemicals or oils down them.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Wildlife", "body": "Keep food and trash secured to avoid attracting bears. Enjoy wildlife from a distance, and never feed or approach animals. Bears are common here, so please follow the bear safety notes in your home's trash bin instructions. You may see squirrels, deer, black bears, mountain lions and many birds, including western tanagers, violet-green swallows, western bluebirds and pileated woodpeckers.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Caring for the home", "body": "The home has delicate artwork, antiques, carpeting and specialty linens, so please handle them with care.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Security", "body": "Please lock the exterior doors whenever you leave. For everyone's security, please don't share your door code, gate code, keys or other access information with anyone who isn't part of your reservation. If you have trouble getting in, message us rather than forcing or tampering with a lock or door.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Rural mountain living", "body": "Three Rivers is a rural mountain community. Power outages, road closures, wildlife activity, river conditions, weather and seasonal fire restrictions can occasionally affect the area. Because cell service can be limited, connect to the home Wi-Fi after you arrive and keep the property address handy.", "image": "", "link": "", "linkLabel": ""}], "local": [{"category": "Parks & Outdoors", "name": "Sequoia & Kings Canyon National Parks", "description": "Giant sequoias, canyon views and hiking. The Ash Mountain park entrance is about 10 to 15 minutes from the home (travel times vary). Please check nps.gov/seki for closures and current conditions before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Sequoia+National+Park+entrance+Three+Rivers+CA", "image": "PLACEHOLDER: Photo of giant sequoias or the park entrance sign"}, {"category": "Parks & Outdoors", "name": "General Sherman Tree & Giant Forest", "description": "The world's largest tree by volume, in a grove of giant sequoias in Sequoia National Park. Allow about an hour to drive up from the home, plus time to walk the trail. Please check nps.gov/seki before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=General+Sherman+Tree+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of General Sherman Tree & Giant Forest"}, {"category": "Parks & Outdoors", "name": "Moro Rock & Crescent Meadow", "description": "A granite dome with steps up to sweeping views of the Great Western Divide, and a peaceful meadow walk nearby, both in Giant Forest. The road generally opens by the Wednesday before Memorial Day and closes once snow makes it impassable. From about late May to early September, it's closed to private vehicles on weekends and holidays during the day, and a free shuttle runs from Giant Forest Museum. Please check nps.gov/seki before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Moro+Rock+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Moro Rock & Crescent Meadow"}, {"category": "Parks & Outdoors", "name": "Hospital Rock", "description": "A picnic spot by the river with Native American pictographs, about 15 to 20 minutes past the park entrance and the Foothills Visitor Center at Ash Mountain. A peaceful first stop on your way into the park.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Hospital+Rock+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Hospital Rock"}, {"category": "Parks & Outdoors", "name": "Lake Kaweah", "description": "A reservoir about 10 to 15 minutes from town toward Visalia, which you pass on the drive into Three Rivers. Good for fishing, picnics and birdwatching. Water levels and fishing rules vary, so please check before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Lake+Kaweah+Lemon+Cove+CA", "image": "PLACEHOLDER: Photo of Lake Kaweah"}, {"category": "Parks & Outdoors", "name": "Park visitor centers", "description": "Foothills Visitor Center, just inside the park entrance near Three Rivers, is a good first stop for maps and trail advice. Lodgepole Visitor Center is deeper in the park, near the giant sequoias. Please check nps.gov/seki for current hours and details.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Foothills+Visitor+Center+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Park visitor centers"}, {"category": "Parks & Outdoors", "name": "Kings Canyon National Park", "description": "Sequoia's neighbor to the north, with the giant sequoias of Grant Grove and the deep Kings Canyon. It's a longer drive from Three Rivers, so many guests make it a full day. Please check nps.gov/seki before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Kings+Canyon+National+Park+Grant+Grove", "image": "PLACEHOLDER: Photo of Kings Canyon National Park"}, {"category": "Parks & Outdoors", "name": "Mineral King", "description": "A remote alpine valley at the end of a narrow, winding, partly unpaved road, with trails and wildflowers. The road is open seasonally, generally from the Wednesday before Memorial Day to the last Wednesday in October. RVs and trailers aren't recommended, and weekday construction closures are planned through 2027. Please check nps.gov/seki before planning a visit.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Mineral+King+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Mineral King"}, {"category": "Parks & Outdoors", "name": "Silver City Mountain Resort", "description": "A seasonal mountain resort on Mineral King Road, about 3 miles before the Mineral King Ranger Station, known for its pie. It's open in the warmer months, so please check before you make the trip.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Silver+City+Mountain+Resort+Mineral+King", "image": "PLACEHOLDER: Photo of Silver City Mountain Resort"}, {"category": "Dining & Coffee", "name": "The Gateway", "description": "Riverside restaurant and lodge overlooking the Kaweah River, with American dinners and a popular bar. Reservations are a good idea on summer weekends.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=The+Gateway+Restaurant+and+Lod function renderSection(id) {

        if (DATA.showPh) { var lph = el('div', 'phbox'); lph.appendChild(el('span', 'phi', '\uD83D\uDCF7')); lph.appendChild(el('span', 'pht', 'Photo needed: ' + l.image.replace(/^PLACEHOLDER:\s*/, ''))); c.appendChild(lph); }

  var tgt = null;
  if (want) { var cs = document.querySelectorAll('.card'); for (var q = 0; q < cs.length; q++) if (cs[q].getAttribute('data-t') === want) { tgt = cs[q]; break; } }
  if (tgt && tgt !== f) tgt.className += ' found';
  if (tgt) tgt.scrollIntoView({ block: 'center' }); else if (f && im) f.scrollIntoView({ block: 'center' }); else (window.scrollTo(0, 0), document.body.scrollTop = 0);
}

function toTop() { try { window.scrollTo(0, 0); document.body.scrollTop = 0; document.documentElement.scrollTop = 0; } catch (e) {} }
function route() {
  if (DATA.mode === 'directory') return renderDirectory();
  if (DATA.mode !== 'guidebook') return renderNotFound();

  try { m ? renderSection(m[1]) : renderHome(); } catch (e) { try { location.reload(); } catch (e2) {} return; }
