hbors and the dark night environment.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Address", "body": "40908 Cherokee Oaks Drive, Three Rivers, CA 93271", "image": "", "link": "https://www.google.com/maps/search/?api=1&query=40908+Cherokee+Oaks+Drive+Three+Rivers+CA+93271", "linkLabel": "Open in Maps"}, {"section": "wifi", "title": "Wi-Fi", "body": "Network: Reyium\nPassword: 3RiversHealing\nInternet outages: If the internet goes down, please message us as soon as possible. We'll work with the local provider on a fix or a timeline for restoring service. Internet speed and availability can't be guaranteed in this rural area.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Hot water", "body": "The water heater comfortably handles about two showers at a time, so staggering showers keeps everyone's water hot.", "image": "", "link": "", "linkLabel": ""}, {"section": "explore", "title": "Three Rivers", "body": "Three Rivers is the gateway community to Sequoia National Park, with restaurants, coffee shops, river access, hiking and beautiful scenery year-round. Road, weather, river and park conditions change with the seasons, so please check current conditions (nps.gov/seki for the park) before heading into the park or planning outdoor activities.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Add a guided experience", "body": "Reyium is a wellness-minded retreat among the sequoias and the Kaweah River. If you'd like to add a guided experience to your stay, we offer the following. Availability varies, so please ask ahead.", "image": "data:image/webp;base64,UklGRuz9AABXRUJQVlA4IOD9AABwswOdASowAmcCPtFQoEuoJCMlMDid0QAaCWNmorkvmBOriBA0ERh89TskY9+u6A/W7xTMR4z/G+b/7d3svUTuRedZ09/et8XM+deKf6B/O98f5192/1PWO/e8dfwP+n5n/fl/h99Pzh/zPA39d/svQRxj/635ieM9x3/M9Br4B/G+dt+n55fvX+49gP9ivVX/yeMP+f/8vsCf2f/e+sJ/x//7zqftH/P9g38+f9x20vS8LxJSAkhzQzURJg78VLzR9DCs/k0IceCNNY/ijxlYyr+9xfavrK5HeobC2hohvQyAmqQ bles and closets is usually all it takes.", "image": "", "link": "", "linkLabel": ""}, {"section": "checkout", "title": "Left something behind?", "body": "Please message us as soon as you notice something is missing so we can check the home. If we find your item, we're happy to mail it back to you. Return shipping and handling costs are the guest's responsibility.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Towels & cleaning supplies", "body": "Extra towels, sheets, pillows and blankets are in the cabinets in the master bedroom hallway.\nThe broom and mop are in the hallway near the laundry room and master bathroom, and cleaning products are under the kitchen sink.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Laundry", "body": "You're welcome to use the washer and dryer during your stay. Laundry pods and dryer sheets are provided in the laundry room.\nThe iron is in the drawers to the left of the washing machine.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Bath & home supplies", "body": "We provide shampoo, conditioner, body soap and hand soap, plus dish soap, dish detergent, dishwasher pods, laundry pods and dryer sheets. You're also welcome to bring and use your own soaps and products.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Trash bins", "body": "Wildlife is common in Three Rivers, and bears are strongly attracted to food and trash. Keeping the bins secured protects the neighborhood and keeps wildlife from becoming dependent on human food. The bins are inside the fenced area to the left of the front door. You can reach them from the front walkway, or from the side of the home through the additional gate near the hot tub.\nGrey bins: trash and food waste. Put all food scraps, food packaging and anything with a smell here.\nBlue bin: recycling. Bottles, cans, cartons, glass, clean cardboard and paper only.\nGreen bin: yard waste. Leaves, grass clippings and other garden waste only.\n> Bear safety: These are bear-resistant cans, so please make sure the lids are always closed and latched. Please don't move the bins to the street. Our team puts them out on Tuesdays and Wednesdays and brings them back.\nHave more trash than fits? Message us and we'll arrange to use a neighboring home's bins.", "image": "data:image/webp;base64,UklGRuiKAQBXRUJQVlA4INyKAQAQ7AOdASrQAh4CPpU4lEiloyIqNVt7oUASiWJtefN64+JVOnT1sFZZ0h8fQE00Eek/5PWN+0k5Y8unzqtdR/aT5PSY9D+tseLAF7K/y+an774Bf/R60/8H6gn9W9GPp18yn7n+sj6cv8N6gH97/6frWerV/iv/T////p8BXnJ//X96Pht/wn/p/eb4GP3O///sAf//21v4B/8erXi3+ZfwX+q/vHiX41PgH7v/mv2W/ff7B/rj/t/xngz9W/mf2r/33sJ/OfyB/d/w/7+/8n5m/x3/o/y/in8c/+f/K+wR+e/2P9ifV6+s/arueNp/0n/0/13+v9wX3F+6fsx44/1L6j/qH+P/+n+q+AH+i/3z0N/5fg3/eP+R+63wC/1//Xf/b/g/mD9Nf+Z/+/+R+c3uA/X/997Bf7NftZ7e3///+/w7/fj////L4kf3r//48f6idfZUGYmUyqsgHXNF7NlNkOOWHS6WZFKXCWgT/XsMLznhIRBGyMRG9HVkjDlkrlPPpkw3QACCISHu4CNc3jtUjejXQiCHx8jOWyn/W71DB66f/YDu+d/DIw3vyHEhc4t0+fYHA47ygoFSkRXA48/NW/sHFgB3BTMno1R6C++5j1KVg1TLDlpFS1OmPMlXcKWHV7jCSl1yAXFjCnqNd3uTDDFaHrEiPfLxJkfVmcbcmzC9FThqb6fGKs1aiLD7HQiYM9p1WD3pVmR/nZ7K4G74ntXyfmXb27Zzirpvdmiy5wlPwHXR84Lw7KWxAgbDY0zPLUozt7pb3utclcBoZ+XJNOKGp4zEkNyPhoPGgSDegGLbC+LpAS0NcaXiUvxcCY+u93XT3C+RhhPx7FykI35QiGcnJJUxWgyj+4QFwyZ0YsTCwlELbmyWxbOJYfgo9djOn+w90lCQEo3HY5m1m0Vx71QKeVM8BSn2dLZTO88TZmI51kd1jb0n95Fntvq1AiyyuTFxU+RjKlypyZ9N24GDfoc9YHcn030JTDgARKMGsPuYQNGjL2fAgogC9bQ4O30Gdx34/2t/vae4zJvQqCiCeqpyqqmnW50/H6jOmve4cuNIVsCHmMHOjXpxYXidZa+sGHb0HYZ6y01aZe4WjqvI8n1a0WkXb6tapafHLBeqOFy9b6TLSyXTX0yVQ1lPj2Jcb1pz0qaLINHqcubv3j/zewxXQUs0c02YudV0inyZrpUZ8cc5ZMoxJ/iTcPUrwIxjfjuHZtgK3I3t2pH/8NJtOli162BWsn9IT/YXQKCWYekgsvMimS+a5/B/COsUnRkFTBn9oHj8zY8XyxAMFcDh9/P6fi3cP+mMCnO1WYxLg5HuuooVtUQ1PLF9qovV/SapUZ6EgbjjzUAOFTdejDoEq/Oeh3XWFIna1i8fy1n0RHNx6wh2z6vCScZ+bP8zXNwc2/8809YDrXecs2XI1nLgsXfvXkOYnQIX1urVag0NR0xmrr8k5s427RIwIwByjoNsTt4mmJ8Ek4l77wOU2UTZdCnpDblyKiqv4ARbaksisZh+u773+IWtLJEbL/1yChWC4wDA3UnIe/5j+cOlCyQhnTF19j8x1XJ3Cf2lX+wQLL5rP+8 before you leave so your account stays private.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Dishwasher", "body": "Please use one dishwasher pod per load. The pods are in the cabinet under the kitchen sink.\nLoading: Scrape off large food scraps, but there's no need to rinse. Please don't overload it, and leave space so water can reach everything.\nSize: Make sure nothing is too tall or too large to fit, so the spray arms can turn freely and the door closes fully.\nNot in the dishwasher: Please hand wash cast iron, sharp knives, wooden items and anything not marked dishwasher safe.\nRunning it: Place the pod in the dispenser, close the door, choose a cycle and press start. If it isn't draining or running properly, please message us.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Check-in", "body": "Check-in starts at 4:00 PM. Gate and door access codes are provided 30 to 45 minutes before check-in.\nEarly check-in and late checkout aren't available unless arranged with us in advance.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Guest count & pets", "body": "This home sleeps up to 11 overnight guests. Please make sure your reservation lists every guest, including children and infants. Guest counts must be accurate. Additional guests need advance approval and may result in added fees.\nPets are welcome only with advance approval, up to 2 per home. Some breeds aren't allowed, so please ask before you book. A $150 pet fee per home is due before check-in. Please bring your pet's own bed. Approved pets must stay off beds, couches, furniture and mats, and any accidents should be reported. Excessive shedding or damage may result in additional charges. Please keep pets under control and close by when outside because of the wildlife, clean up after them, and don't leave pet food outdoors.\n> Unapproved pets: Pets that aren't approved on your reservation may result in fees under your booking platform's policies.\nVerified service animals are always welcome. We kindly ask that you let us know ahead of your stay, but it isn't required.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Kitchen", "body": "Please use the range hood when cooking. Opening a nearby window also helps when you're cooking something steamy or smoky. Before bed, please put food away and place dishes in the dishwasher or sink, because wildlife is very active here.\nCoffee & tea: A limited amount of coffee and tea is provided. If you have specific preferences, we recommend bringing your own.", "image": "", "link": "", "linkLabel": ""}, {"section": "wifi", "title": "Heating & cooling", "body": "Your home has a smart thermostat linked to your reservation, so it's already set up for your stay. It's set to keep the home between 70 and 75°F and heats or cools automatically as needed. You're welcome to adjust the temperature up or down to your liking. There's nothing to reset when you leave.\nKeeping doors and windows closed while the heating or cooling is running helps keep the home comfortable.", "image": "data:image/webp;base64,UklGRtwkAABXRUJQVlA4INAkAAAw6gCdASomAmwCPkkkkUYioiGnoVN4uPAJCWlucvTqyjDANjUi5s7uiP8Z2oERGLVJG/e5F8fX+DhD180j5q1h646jHpV7Xr9d65eUX6ePmA/SX/Vf2v3t/Rf6AH7D9YX+zPsAfsd6TH7W/Bb+137VezV/+taB92+kfy7/N9Mj6O9rP3a0if5R9zv0XzSffDuh+X2oR62/y3zb8vWAL6v/73+/8lH2o9gP9S/976++LP97/6vsCfz/+/fsv7Iv1V+UfvX+pv/V/n/gU/nP9y/5PYr/db2Sf27C/JGdwtn4hGWqt8eV6cREIWlb48r0Wuoz//+xRsiebs0TMmEp/MOfPIDSvHUGzfzf3Zd8GxLdzWHaAtVDagT7/1IfKxpH/73dgEYyvN0sPWYkllkCoIHVi0djns4n/rGyiEd8ahOvOmdb9E4FafjK5Ji9BzV6C/TujYwKEKLw5fyVuEOcK0IrW4c0u5eB9tWd1PwAOqPYEpRcazRCsZ/6smbt/X8ummdc/J9WI7b4OtodHZcRqoG5XlBVeYekiiZ4iQonN9sPTsyhx/9lyIf/KrD77V2aMgaCccKqpIgofqSAnC5iDN2BajRX5V4M4U4Sty67MWDZGIEGuoWY9bzNEieqhHBU8edLGqe8DAkoQgoVnrI2dPWdbdAFu2wF8JmgjzD2XIfL9jF5ZaxX0XDuJw9JNNWxbWiMIR2t7Uo8wVpMnYBP3CoeWUHCXPAwbitdqMVW+5Q5I2NV4Anse/ohNwrWAR9nmpZ99IRadnHgWIhzz8KH126fDxyCWtDBPDO0X2L2mMZrioei ay also be available through services such as Instacart or Walmart+. Please confirm that the delivery address and service area are supported before you order, and be available to receive the delivery promptly.", "image": "", "link": "", "linkLabel": ""}, {"section": "explore", "title": "Swimming & river access", "body": "River time is always a highlight. River levels and temperatures change with the season, so check conditions before you go in, and keep a close eye on children. Wear water shoes and any safety equipment you need, such as life jackets. There is no lifeguard, and swimming is at your own risk.\nLooking for another spot? Locals also swim at a spot inside Sequoia National Park, near the visitor center. Ask us for directions.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Hapé ceremony", "body": "A gathering at the river's edge, about an hour long, with a grounding meditation and the rhythm of the drum. Hapé is a traditional Indigenous Amazonian snuff made from ground tobacco and other plants, offered with reverence and intention.\nIf you like, you may bring a journal and a small offering for the altar (a crystal, a feather or any token of gratitude). Comfortable clothing is best, and many people prefer to fast for about three hours beforehand. One person is enough to book.\nParticipation is always optional. If you have any health concerns or questions, please ask us beforehand.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Lights & switches", "body": "Please be mindful and turn lights off when not in use or during daylight hours.\nNight lighting: Keep a flashlight or phone light handy for paths, steps and the river, as the property is dark at night.\nNot sure which switch does what? Please message us and we'll happily help.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Damage", "body": "Please report any accidental damage promptly. Guests are responsible for damage caused during their stay.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Cancellations", "body": "For cancellations or changes, please refer to your booking platform and the cancellation policy shown when you booked. We recommend travel insurance for every trip.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Sound healing & medicinal chant circles", "body": "Gather for sound healing and medicinal chant, a gentle way to relax, release and reset during your stay. Ask us about availability and group size.", "image": "data:image/webp;base64,UklGRsLSAABXRUJQVlA4ILbSAAAwdQOdASowAmcCPtFWokyoJKOtrRfNabAaCU129mt56del2mrxvGRU35nMAigDZG+gFLS2sOJXhPqukTc8n33OolZfVP5hS88r+mv9LSpymenc8P3Pvhenj+xbynzb+bT6if65v1G9Q/2/Hs5TPmH8/3x/m32j/W/xvor5I/df8jzO/AH/X1k/4PgP869RTzZ6dsOnsd+x6HHxRlt/u+hH7f5WX7ocwZ++9Q7/G+j1/0+Zz9k/7H7rfAv03PScCFW/3p8HjUFaCI74iEv2yGLO7b4NNgMyeJAlCiReXMpMPYYuD/MHIraBhMfU+wt1rTZPJ4I7AepbqVPZK3ejL+/TeneRqLpAuIVoLu2HzbXoJdD5CbW99xvcXV8/Kk8L7n7uQugd9msgZBCJgdDbIMKpPip2r76K1rtwj3ne9Bw7sK7pVavJWHIV4UgIMGdNorvldXaOkACl4KmDTnRZdaF5oBm5/uCWLXG8EXFSIap7wpT1gs9ksIAEy+RBsWHeRKcXT1zag45LGqxkwDND3iCbi73Fq9R7GTgzeVAlZzLbZ/g2wghqYGTBH8BdQ7RIUdSS4TNPSNOBbmh3HQ9Bk5y2OAbywc20Mwsb4psTTUL+H+2W1wc0FFG5bf7crZxe1EykssJXw4d1kmdrWZVTs1m48/kgNRsLTnk6g3ZquOjKHUDl0gFmPh3ORFlh8KdNDFXWFvEG/MDL9xGWy0yyK7ntPrk9Y+mOQ1fcncs0nUGwqy3bpiPL2GydIZb6nVT2l+v1395wOmjPc0jZX3gKJq2nJOixMNTrBg2nuLZrqjtuvGmW35Jdn9pUzK3L/96P3Rq7ln/ryGH4jjlr/XG5CdjDNolDhm+D+EOseVcWq4JMwuRJ7tbrEL8SlHZ5t8qO3J/yHSBvbzbio2uPOoZ1S6N09MILST0ONynXHpPRm4Wog6d1tnd92HP4Cw0KXnAFUKPzXqbdmwVJcOcPL0oNus0Is8UJCSfSiF/8mlGTat74vp5jUhRKT8BaWWNFvqDxCygO2LmfcT9G6AvHf3zxlk8lQbqS1cw+xDvXEmvnqwL37Ir58sq2T1jkJqOSxYDEoihhvJAPUePuszXRt7Wkwcf1CPHLTj6Dn2mPUNY+E4oppyIkCYMsktq0kwAJVI9fMcS/C7uaDm6PSDZoL5du6tl7FfDOeHhRkzisAUDesd9rtW2ALfg9wq2ON3Gl3O/KE6ziGcvitzobecaz1rBonCKjKqsRwIbciMHq05hpwSyWbU459PPHv+/yVlVwnVFeFJKW1IlC5I4gIISIyJw549xAisc+SdAFPuvpCNm0P69/Z7cwlVOgvcbBNNHa0xU7I3jx4YXbIr7D s strong, or the heat or jets aren't working properly, please contact us right away and we'll send someone from our team to take a look.\nChildren under 12 are not permitted in the spa. Ages 12 to 17 need continuous adult supervision, may not use it alone, and may not use it at night. Please monitor all children closely.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "EV charger", "body": "> Coming soon: An EV charger is planned for this home in 2027. We'll update this guide when it's ready.\nThere is no EV charger at this home yet.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Online sessions & retreats", "body": "Want to continue the journey at home? Reyium offers 1:1 online sessions and retreats. Visit reyium.com to learn more.", "image": "", "link": "https://reyium.com", "linkLabel": "Visit reyium.com"}, {"section": "guidelines", "title": "More home rules", "body": "No guest mail or packages may be sent to the property.\nDaily housekeeping is not included. Optional light housekeeping may be available for a fee.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Grounds & maintenance team", "body": "Our grounds and maintenance team looks after our Three Rivers homes, and you may see them nearby on weekdays, usually between about 11 AM and 4 PM. They might be doing yard work, emptying trash cans or light maintenance, and we plan their work to stay out of your way. If you ever have a question or want a quiet day, just send us a message.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Forest bathing", "body": "Forest bathing (Shinrin-Yoku) is a slow, mindful walk among the trees, focused on breathing in the forest air and noticing the sights and sounds of nature. Message us for more information.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Kambo ceremony", "body": "Kambo is a traditional ceremony that uses a natural frog secretion from the Amazon. Message us for more information.\nParticipation is always optional. If you have any health concerns or questions, please ask us beforehand.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Mountain e-bikes", "body": "Explore the roads around Three Rivers and Sequoia on two wheels. Mountain e-bikes are available upon request (up to 3 bikes). Please request your e-bikes well before check-in so we can confirm availability. Inside Sequoia and Kings Canyon, bikes and e-bikes are allowed on roads but not on hiking trails. Message us for more information.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Group sound baths", "body": "Group sound baths are available for up to 20 people. Let the calming sounds wash over you. Message us for more information.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "Private chef & massage", "body": "Would you like a private chef or an in-home massage during your stay? Please check with us for availability and options.", "image": "", "link": "", "linkLabel": ""}, {"section": "experiences", "title": "How to book an experience", "body": "Message us through your booking platform, or text Georgel at 818-400-2669 to ask about availability and details.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Events & extra guests", "body": "Events, parties, weddings, professional photography, filming and other gatherings must be discussed with us and approved before you book. Unapproved events may result in cancellation without a refund, removal from the property and additional fees under your booking platform's policies. Private family dinners are always welcome.", "image": "", "link": "", "linkLabel": ""}, {"section": "arrival", "title": "Parking & neighbors", "body": "Please park only in the driveway (it fits 3 to 4 cars) or on the street, following all posted traffic signs and markings. Don't block the road, neighboring driveways, gates or access areas.\nOur homes are in a residential subdivision, so please follow posted speed limits and be respectful of the neighbors and their privacy.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Mid-stay housekeeping", "body": "Mid-stay housekeeping is available for an additional fee with advance notice, ideally a few days before your stay. Message us to arrange it.", "image": "", "link": "", "linkLabel": ""}, {"section": "explore", "title": "Fishing", "body": "A California fishing license is required for anyone 16 and older. Short-term and annual licenses are available. You can buy one online from California Fish and Wildlife before you arrive. Rules and seasons vary by water, so please check current regulations. The river is low and slow much of the year and isn't a dependable fishing spot. Lake Kaweah nearby has bass, catfish, crappie and trout. Please take all line and hooks with you.", "image": "", "link": "https://licenses.wildlife.ca.gov/internetsales", "linkLabel": "Buy a fishing license"}, {"section": "guidelines", "title": "River & outdoor safety", "body": "Please use care around the river, rocks, trails, steps, decks and rooftops. River conditions can change dramatically through the year, rocks can be extremely slippery, and there is no lifeguard. Water shoes or secure footwear are strongly recommended. Please use non-glass drinkware near the river and outdoor areas, supervise children closely, and never enter the water when it looks swift, deep or unsafe.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Babies & little ones", "body": "Toys, a Pack 'n Play and a booster seat for the dining table are provided. You'll find them in the closet of the red-painted-wall bedroom, off the living room.\nA high chair is available on request, but supply is limited, so please message us ahead of your stay if you'd like one. If you need anything else for little ones, just let us know.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Septic care", "body": "The home uses a septic system. Toilet paper is fine in reasonable amounts. Please don't flush wipes (even ones labeled flushable), diapers, feminine products, paper towels, cotton pads or anything else that isn't toilet paper. Where you can, use natural or eco-friendly products down the drains, and please avoid pouring harsh chemicals or oils down them.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Wildlife", "body": "Keep food and trash secured to avoid attracting bears. Enjoy wildlife from a distance, and never feed or approach animals. Bears are common here, so please follow the bear safety notes in your home's trash bin instructions. You may see squirrels, deer, black bears, mountain lions and many birds, including western tanagers, violet-green swallows, western bluebirds and pileated woodpeckers.", "image": "", "link": "", "linkLabel": ""}, {"section": "home", "title": "Gas fireplace", "body": "This is a gas fireplace. Please don't burn wood, paper or anything else in it. It's available during the cooler months, typically from the end of October through the end of March, and is turned off for the rest of the year.\nFire on demand: Press the thermometer button until the display shows OFF. Flame button: High, Low, Off. Fan button: Off, 1 Low, 2 Med, 3 High.\nKeep the home warm: Press the thermometer button until the display shows ON. Press the Set button, then use the arrows to pick your temperature. The fireplace turns on and off by itself to hold that temperature.\nControls locked: Press the temperature up and down arrows together.\n> Please switch the fire back to on demand and turn the flame off when you leave the home.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Caring for the home", "body": "The home has delicate artwork, antiques, carpeting and linens, so please handle them with care.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Security", "body": "Please lock the exterior doors whenever you leave. For everyone's security, please don't share your door code, gate code, keys or other access information with anyone who isn't part of your reservation. If you have trouble getting in, message us rather than forcing or tampering with a lock or door.", "image": "", "link": "", "linkLabel": ""}, {"section": "guidelines", "title": "Rural mountain living", "body": "Three Rivers is a rural mountain community. Power outages, road closures, wildlife activity, river conditions, weather and seasonal fire restrictions can occasionally affect the area. Because cell service can be limited, connect to the home Wi-Fi after you arrive and keep the property address handy.", "image": "", "link": "", "linkLabel": ""}], "local": [{"category": "Parks & Outdoors", "name": "Sequoia & Kings Canyon National Parks", "description": "Giant sequoias, canyon views and hiking. The Ash Mountain park entrance is about 10 to 15 minutes from the home (travel times vary). Please check nps.gov/seki for closures and current conditions before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Sequoia+National+Park+entrance+Three+Rivers+CA", "image": "PLACEHOLDER: Photo of giant sequoias or the park entrance sign"}, {"category": "Parks & Outdoors", "name": "General Sherman Tree & Giant Forest", "description": "The world's largest tree by volume, in a grove of giant sequoias in Sequoia National Park. Allow about an hour to drive up from the home, plus time to walk the trail. Please check nps.gov/seki before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=General+Sherman+Tree+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of General Sherman Tree & Giant Forest"}, {"category": "Parks & Outdoors", "name": "Moro Rock & Crescent Meadow", "description": "A granite dome with steps up to sweeping views of the Great Western Divide, and a peaceful meadow walk nearby, both in Giant Forest. The road generally opens by the Wednesday before Memorial Day and closes once snow makes it impassable. From about late May to early September, it's closed to private vehicles on weekends and holidays during the day, and a free shuttle runs from Giant Forest Museum. Please check nps.gov/seki before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Moro+Rock+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Moro Rock & Crescent Meadow"}, {"category": "Parks & Outdoors", "name": "Hospital Rock", "description": "A picnic spot by the river with Native American pictographs, about 15 to 20 minutes past the park entrance and the Foothills Visitor Center at Ash Mountain. A peaceful first stop on your way into the park.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Hospital+Rock+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Hospital Rock"}, {"category": "Parks & Outdoors", "name": "Lake Kaweah", "description": "A reservoir about 10 to 15 minutes from town toward Visalia, which you pass on the drive into Three Rivers. Good for fishing, picnics and birdwatching. Water levels and fishing rules vary, so please check before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Lake+Kaweah+Lemon+Cove+CA", "image": "PLACEHOLDER: Photo of Lake Kaweah"}, {"category": "Parks & Outdoors", "name": "Park visitor centers", "description": "Foothills Visitor Center, just inside the park entrance near Three Rivers, is a good first stop for maps and trail advice. Lodgepole Visitor Center is deeper in the park, near the giant sequoias. Please check nps.gov/seki for current hours and details.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Foothills+Visitor+Center+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Park visitor centers"}, {"category": "Parks & Outdoors", "name": "Kings Canyon National Park", "description": "Sequoia's neighbor to the north, with the giant sequoias of Grant Grove and the deep Kings Canyon. It's a longer drive from Three Rivers, so many guests make it a full day. Please check nps.gov/seki before you go.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Kings+Canyon+National+Park+Grant+Grove", "image": "PLACEHOLDER: Photo of Kings Canyon National Park"}, {"category": "Parks & Outdoors", "name": "Mineral King", "description": "A remote alpine valley at the end of a narrow, winding, partly unpaved road, with trails and wildflowers. The road is open seasonally, generally from the Wednesday before Memorial Day to the last Wednesday in October. RVs and trailers aren't recommended, and weekday construction closures are planned through 2027. Please check nps.gov/seki before planning a visit.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Mineral+King+Sequoia+National+Park", "image": "PLACEHOLDER: Photo of Mineral King"}, {"category": "Parks & Outdoors", "name": "Silver City Mountain Resort", "description": "A seasonal mountain resort on Mineral King Road, about 3 miles before the Mineral King Ranger Station, known for its pie. It's open in the warmer months, so please check before you make the trip.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=Silver+City+Mountain+Resort+Mineral+King", "image": "PLACEHOLDER: Photo of Silver City Mountain Resort"}, {"category": "Dining & Coffee", "name": "The Gateway", "description": "Riverside restaurant and lodge overlooking the Kaweah River, with American dinners and a popular bar. Reservations are a good idea on summer weekends.", "distance": "", "map": "https://www.google.com/maps/search/?api=1&query=The+Gateway+Restaurant+and+Lodge+Three+Rivers+CA", "image": "data:image/webp;base64,UklGRpiPAABXRUJQVlA4IIyPAADwYgGdASqQASwBPlEejEQjoaEX/CYgOAUEsbTOVBI9tMvghTO9E/w
